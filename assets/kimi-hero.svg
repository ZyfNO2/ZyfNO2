<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" preserveAspectRatio="xMidYMid meet" role="img" aria-label="ZyfNO2 — agent systems, vision pipelines, and game intelligence">
  <title>ZyfNO2 — profile header</title>
  <desc>Minimal profile card for ZyfNO2 with an AI prompt-style input, two slowly drifting ambient glows, and a gently breathing agent orb with an orbiting status satellite.</desc>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f8f5"/>
      <stop offset="0.58" stop-color="#f4f4f0"/>
      <stop offset="1" stop-color="#ecece7"/>
    </linearGradient>
    <linearGradient id="hero-bg-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b1f"/>
      <stop offset="0.58" stop-color="#17181c"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <radialGradient id="glow-violet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b8c7ff" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#b8c7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-green" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c8f0d2" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#c8f0d2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop class="sweep-stop-mid" offset="0.5" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="pill-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#111111" flood-opacity="0.08"/>
    </filter>
    <clipPath id="card-clip">
      <rect x="1" y="1" width="1198" height="358" rx="34"/>
    </clipPath>
    <clipPath id="pill-clip">
      <rect x="68" y="258" width="660" height="62" rx="31"/>
    </clipPath>
  </defs>

  <style>
    .bg { fill: url(#hero-bg); stroke: #deded8; }
    .eyebrow { fill: #83837c; }
    .title { fill: #141412; }
    .subtitle { fill: #55554f; }
    .pill { fill: #ffffff; stroke: #ddddda; }
    .pill-icon { fill: #141412; }
    .pill-arrow { stroke: #ffffff; }
    .pill-text { fill: #2d2d29; }
    .pill-chip { fill: #f0f0ec; }
    .pill-chip-text { fill: #666661; }
    .orb-outer { fill: #141412; }
    .orb-mid { fill: #f6f6f2; }
    .orb-core { fill: #141412; }
    .orb-ring { stroke: #141412; }
    .glow { opacity: 0.82; }

    .drift-a { animation: drift-a 17s ease-in-out infinite alternate; }
    .drift-b { animation: drift-b 14s ease-in-out -6s infinite alternate; }
    .sweep-wrap { opacity: 0; animation: sweep 9s ease-in-out infinite; }
    .breathe { animation: breathe 5.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .orbit { animation: orbit 80s linear infinite; transform-box: fill-box; transform-origin: center; }
    .pulse { animation: pulse 4.4s ease-in-out infinite; }

    @keyframes drift-a { from { transform: translate(0, 0); } to { transform: translate(-34px, 22px); } }
    @keyframes drift-b { from { transform: translate(0, 0); } to { transform: translate(38px, -20px); } }
    @keyframes sweep {
      0% { transform: translateX(0); opacity: 0; }
      5% { opacity: 0.5; }
      22% { transform: translateX(880px); opacity: 0.5; }
      28% { transform: translateX(880px); opacity: 0; }
      100% { transform: translateX(880px); opacity: 0; }
    }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

    @media (prefers-color-scheme: dark) {
      .bg { fill: url(#hero-bg-dark); stroke: #2e3138; }
      .eyebrow { fill: #7d828c; }
      .title { fill: #eef0f2; }
      .subtitle { fill: #a3a8b1; }
      .pill { fill: #1f2127; stroke: #353842; }
      .pill-icon { fill: #e9eaec; }
      .pill-arrow { stroke: #17181b; }
      .pill-text { fill: #c8ccd3; }
      .pill-chip { fill: #2a2d34; }
      .pill-chip-text { fill: #9aa0ab; }
      .orb-outer { fill: #e9eaec; }
      .orb-mid { fill: #17181b; }
      .orb-core { fill: #e9eaec; }
      .orb-ring { stroke: #e9eaec; stroke-opacity: 0.22; }
      .glow { opacity: 0.34; }
      .sweep-stop-mid { stop-opacity: 0.2; }
    }

    @media (prefers-reduced-motion: reduce) {
      .drift-a, .drift-b, .sweep-wrap, .breathe, .orbit, .pulse { animation: none; }
    }
  </style>

  <rect class="bg" x="1" y="1" width="1198" height="358" rx="34" fill="url(#hero-bg)" stroke="#deded8"/>

  <g id="ambient-glows" clip-path="url(#card-clip)" filter="url(#soft-blur)">
    <circle class="glow drift-a" cx="1010" cy="82" r="170" fill="url(#glow-violet)" opacity="0.82"/>
    <circle class="glow drift-b" cx="890" cy="290" r="150" fill="url(#glow-green)" opacity="0.82"/>
  </g>

  <g id="hero-copy" font-family="Inter, Arial, sans-serif">
    <text class="eyebrow" x="68" y="66" fill="#83837c" font-size="15" font-weight="600" letter-spacing="3">PROFILE / SYSTEMS / RESEARCH</text>
    <text class="title" x="68" y="160" fill="#141412" font-size="78" font-weight="700" letter-spacing="-3">ZyfNO2</text>
    <text class="subtitle" x="70" y="207" fill="#55554f" font-size="23">Building reliable agent systems, vision pipelines, and game intelligence.</text>

    <g id="prompt-pill">
      <rect class="pill" x="68" y="258" width="660" height="62" rx="31" fill="#ffffff" stroke="#ddddda" filter="url(#pill-shadow)"/>
      <g clip-path="url(#pill-clip)">
        <g class="sweep-wrap">
          <rect x="-40" y="240" width="120" height="100" fill="url(#sweep-grad)" transform="skewX(-16)"/>
        </g>
      </g>
      <circle class="pill-icon" cx="101" cy="289" r="17" fill="#141412"/>
      <path class="pill-arrow" d="M94 289h13m-5-5 5 5-5 5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="pill-text" x="132" y="297" fill="#2d2d29" font-size="19" font-weight="500">What are we building next?</text>
      <rect class="pill-chip" x="574" y="275" width="134" height="28" rx="14" fill="#f0f0ec"/>
      <text class="pill-chip-text" x="641" y="294" text-anchor="middle" fill="#666661" font-size="13" font-weight="600">OPEN PROFILE</text>
    </g>

    <g id="agent-orb" transform="translate(945 180)">
      <g class="breathe">
        <circle class="orb-outer" cx="0" cy="0" r="74" fill="#141412"/>
        <circle class="orb-mid" cx="0" cy="0" r="52" fill="#f6f6f2"/>
        <circle class="orb-core" cx="0" cy="0" r="23" fill="#141412"/>
        <g class="orbit">
          <circle cx="0" cy="0" r="96" fill="none"/>
          <circle class="orb-ring" cx="0" cy="0" r="91" fill="none" stroke="#141412" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="7 10"/>
          <circle class="orb-satellite pulse" cx="0" cy="-91" r="5" fill="#6fbf8e"/>
        </g>
      </g>
    </g>
  </g>
</svg>
