<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Research vector from rule systems to adaptive agents">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9c9c4"/>
      <stop offset="0.5" stop-color="#9eaef2"/>
      <stop offset="1" stop-color="#8bc9a0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#111111" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="188" rx="28" fill="#f8f8f5" stroke="#e1e1dc"/>
  <text x="46" y="43" fill="#777772" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2.4">CURRENT RESEARCH VECTOR</text>

  <line x1="145" y1="115" x2="1050" y2="115" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <circle r="6" cy="115" fill="#11110f">
    <animate attributeName="cx" values="145;1050" dur="4.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4.8s" repeatCount="indefinite"/>
  </circle>

  <g font-family="Inter, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(42 79)">
      <rect width="230" height="72" rx="24" fill="#ffffff" stroke="#ddddda"/>
      <circle cx="35" cy="36" r="14" fill="#ecece8"/>
      <text x="35" y="41" text-anchor="middle" fill="#555550" font-size="14" font-weight="700">01</text>
      <text x="62" y="32" fill="#1e1e1b" font-size="17" font-weight="700">Rule systems</text>
      <text x="62" y="53" fill="#777772" font-size="13">explicit control</text>
    </g>

    <g transform="translate(335 79)">
      <rect width="230" height="72" rx="24" fill="#ffffff" stroke="#ddddda"/>
      <circle cx="35" cy="36" r="14" fill="#e8ebf9"/>
      <text x="35" y="41" text-anchor="middle" fill="#5062a7" font-size="14" font-weight="700">02</text>
      <text x="62" y="32" fill="#1e1e1b" font-size="17" font-weight="700">Imitation learning</text>
      <text x="62" y="53" fill="#777772" font-size="13">learn from examples</text>
    </g>

    <g transform="translate(628 79)">
      <rect width="230" height="72" rx="24" fill="#ffffff" stroke="#ddddda"/>
      <circle cx="35" cy="36" r="14" fill="#e6f2ea"/>
      <text x="35" y="41" text-anchor="middle" fill="#39734d" font-size="14" font-weight="700">03</text>
      <text x="62" y="32" fill="#1e1e1b" font-size="17" font-weight="700">Reinforcement</text>
      <text x="62" y="53" fill="#777772" font-size="13">improve through feedback</text>
    </g>

    <g transform="translate(921 79)">
      <rect width="237" height="72" rx="24" fill="#11110f"/>
      <circle cx="35" cy="36" r="14" fill="#ffffff" fill-opacity="0.14"/>
      <text x="35" y="41" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">04</text>
      <text x="62" y="32" fill="#ffffff" font-size="17" font-weight="700">Adaptive agents</text>
      <text x="62" y="53" fill="#c9c9c4" font-size="13">evaluated and reliable</text>
    </g>
  </g>
</svg>