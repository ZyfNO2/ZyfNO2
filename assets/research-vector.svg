<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Research vector roadmap: rule systems, imitation learning, reinforcement learning, adaptive agents">
  <title>Research vector</title>
  <desc>A four-stage research roadmap. A progress rail advances stage by stage from rule systems through imitation learning and reinforcement learning to adaptive agents, pauses, then restarts.</desc>
  <defs>
    <filter id="rv-shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#111111" flood-opacity="0.07"/>
    </filter>
  </defs>

  <style>
    .bg { fill: #f7f7f4; stroke: #e0e0da; }
    .rail-track { stroke: #e2e2dc; }
    .rail-progress { stroke: #141412; stroke-dasharray: 100; stroke-dashoffset: 0; animation: rail-fill 10s ease-in-out infinite; }
    .connector { stroke: #e2e2dc; }
    .card-dim { fill: #ffffff; stroke: #e4e4de; }
    .chip-dim { fill: #f1f1ec; }
    .chip-num-dim { fill: #96968f; }
    .label-dim { fill: #96968f; }
    .caption-dim { fill: #b0b0a8; }
    .dot-dim { fill: #f7f7f4; stroke: #cfcfc8; }
    .card-on { fill: #ffffff; stroke: #c6c6bf; filter: url(#rv-shadow); }
    .chip-on { fill: #141412; }
    .chip-num-on { fill: #ffffff; }
    .label-on { fill: #141412; }
    .caption-on { fill: #55554f; }
    .dot-on { fill: #141412; stroke: #141412; }
    .dot-ring { fill: none; stroke: #8b7ff0; stroke-opacity: 0.4; }

    .stage-on { opacity: 1; }
    .stage-on-1 { animation: stage-on-1 10s ease-in-out infinite; }
    .stage-on-2 { animation: stage-on-2 10s ease-in-out infinite; }
    .stage-on-3 { animation: stage-on-3 10s ease-in-out infinite; }
    .stage-on-4 { animation: stage-on-4 10s ease-in-out infinite; }

    @keyframes rail-fill {
      0%, 8% { stroke-dashoffset: 100; }
      22%, 27% { stroke-dashoffset: 66.67; }
      42%, 47% { stroke-dashoffset: 33.33; }
      62%, 93% { stroke-dashoffset: 0; }
      97%, 100% { stroke-dashoffset: 100; }
    }
    @keyframes stage-on-1 { 0%, 3% { opacity: 0; } 8%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes stage-on-2 { 0%, 22% { opacity: 0; } 27%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes stage-on-3 { 0%, 42% { opacity: 0; } 47%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes stage-on-4 { 0%, 62% { opacity: 0; } 67%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #18191d; stroke: #2d3038; }
      .rail-track { stroke: #2d3038; }
      .rail-progress { stroke: #d5d8de; }
      .connector { stroke: #2d3038; }
      .card-dim { fill: #1e2025; stroke: #2d3038; }
      .chip-dim { fill: #26282e; }
      .chip-num-dim { fill: #6d727c; }
      .label-dim { fill: #6f747e; }
      .caption-dim { fill: #565b64; }
      .dot-dim { fill: #18191d; stroke: #3a3d46; }
      .card-on { fill: #22242a; stroke: #40444e; }
      .chip-on { fill: #eceef1; }
      .chip-num-on { fill: #17181b; }
      .label-on { fill: #eceef1; }
      .caption-on { fill: #a3a8b1; }
      .dot-on { fill: #eceef1; stroke: #eceef1; }
      .dot-ring { stroke: #8b7ff0; stroke-opacity: 0.45; }
    }

    @media (prefers-reduced-motion: reduce) {
      .rail-progress, .stage-on { animation: none; }
    }
  </style>

  <rect class="bg" x="1" y="1" width="758" height="558" rx="30" fill="#f7f7f4" stroke="#e0e0da"/>

  <g id="research-rail">
    <line class="rail-track" x1="84" y1="88" x2="84" y2="472" stroke="#e2e2dc" stroke-width="3" stroke-linecap="round"/>
    <line class="rail-progress" x1="84" y1="88" x2="84" y2="472" pathLength="100" stroke="#141412" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g id="stage-01-rule-systems" class="stage" font-family="Inter, Arial, sans-serif">
    <g class="stage-dim">
      <line class="connector" x1="93" y1="88" x2="128" y2="88" stroke="#e2e2dc" stroke-width="2"/>
      <rect class="card-dim" x="128" y="40" width="584" height="96" rx="22" fill="#ffffff" stroke="#e4e4de"/>
      <rect class="chip-dim" x="156" y="68" width="40" height="40" rx="13" fill="#f1f1ec"/>
      <text class="chip-num-dim" x="176" y="93" text-anchor="middle" fill="#96968f" font-size="15" font-weight="700">01</text>
      <text class="label-dim" x="214" y="85" fill="#96968f" font-size="24" font-weight="700">Rule systems</text>
      <text class="caption-dim" x="214" y="111" fill="#b0b0a8" font-size="16">Explicit, inspectable control</text>
      <circle class="dot-dim" cx="84" cy="88" r="9" fill="#f7f7f4" stroke="#cfcfc8" stroke-width="2.5"/>
    </g>
    <g class="stage-on stage-on-1">
      <rect class="card-on" x="128" y="40" width="584" height="96" rx="22" fill="#ffffff" stroke="#c6c6bf"/>
      <rect class="chip-on" x="156" y="68" width="40" height="40" rx="13" fill="#141412"/>
      <text class="chip-num-on" x="176" y="93" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">01</text>
      <text class="label-on" x="214" y="85" fill="#141412" font-size="24" font-weight="700">Rule systems</text>
      <text class="caption-on" x="214" y="111" fill="#55554f" font-size="16">Explicit, inspectable control</text>
      <circle class="dot-ring" cx="84" cy="88" r="15" fill="none" stroke="#8b7ff0" stroke-width="2" stroke-opacity="0.4"/>
      <circle class="dot-on" cx="84" cy="88" r="9" fill="#141412" stroke="#141412" stroke-width="2.5"/>
    </g>
  </g>

  <g id="stage-02-imitation-learning" class="stage" font-family="Inter, Arial, sans-serif">
    <g class="stage-dim">
      <line class="connector" x1="93" y1="216" x2="128" y2="216" stroke="#e2e2dc" stroke-width="2"/>
      <rect class="card-dim" x="128" y="168" width="584" height="96" rx="22" fill="#ffffff" stroke="#e4e4de"/>
      <rect class="chip-dim" x="156" y="196" width="40" height="40" rx="13" fill="#f1f1ec"/>
      <text class="chip-num-dim" x="176" y="221" text-anchor="middle" fill="#96968f" font-size="15" font-weight="700">02</text>
      <text class="label-dim" x="214" y="213" fill="#96968f" font-size="24" font-weight="700">Imitation learning</text>
      <text class="caption-dim" x="214" y="239" fill="#b0b0a8" font-size="16">Learning from demonstrations</text>
      <circle class="dot-dim" cx="84" cy="216" r="9" fill="#f7f7f4" stroke="#cfcfc8" stroke-width="2.5"/>
    </g>
    <g class="stage-on stage-on-2">
      <rect class="card-on" x="128" y="168" width="584" height="96" rx="22" fill="#ffffff" stroke="#c6c6bf"/>
      <rect class="chip-on" x="156" y="196" width="40" height="40" rx="13" fill="#141412"/>
      <text class="chip-num-on" x="176" y="221" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">02</text>
      <text class="label-on" x="214" y="213" fill="#141412" font-size="24" font-weight="700">Imitation learning</text>
      <text class="caption-on" x="214" y="239" fill="#55554f" font-size="16">Learning from demonstrations</text>
      <circle class="dot-ring" cx="84" cy="216" r="15" fill="none" stroke="#8b7ff0" stroke-width="2" stroke-opacity="0.4"/>
      <circle class="dot-on" cx="84" cy="216" r="9" fill="#141412" stroke="#141412" stroke-width="2.5"/>
    </g>
  </g>

  <g id="stage-03-reinforcement-learning" class="stage" font-family="Inter, Arial, sans-serif">
    <g class="stage-dim">
      <line class="connector" x1="93" y1="344" x2="128" y2="344" stroke="#e2e2dc" stroke-width="2"/>
      <rect class="card-dim" x="128" y="296" width="584" height="96" rx="22" fill="#ffffff" stroke="#e4e4de"/>
      <rect class="chip-dim" x="156" y="324" width="40" height="40" rx="13" fill="#f1f1ec"/>
      <text class="chip-num-dim" x="176" y="349" text-anchor="middle" fill="#96968f" font-size="15" font-weight="700">03</text>
      <text class="label-dim" x="214" y="341" fill="#96968f" font-size="24" font-weight="700">Reinforcement learning</text>
      <text class="caption-dim" x="214" y="367" fill="#b0b0a8" font-size="16">Improving through feedback</text>
      <circle class="dot-dim" cx="84" cy="344" r="9" fill="#f7f7f4" stroke="#cfcfc8" stroke-width="2.5"/>
    </g>
    <g class="stage-on stage-on-3">
      <rect class="card-on" x="128" y="296" width="584" height="96" rx="22" fill="#ffffff" stroke="#c6c6bf"/>
      <rect class="chip-on" x="156" y="324" width="40" height="40" rx="13" fill="#141412"/>
      <text class="chip-num-on" x="176" y="349" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">03</text>
      <text class="label-on" x="214" y="341" fill="#141412" font-size="24" font-weight="700">Reinforcement learning</text>
      <text class="caption-on" x="214" y="367" fill="#55554f" font-size="16">Improving through feedback</text>
      <circle class="dot-ring" cx="84" cy="344" r="15" fill="none" stroke="#8b7ff0" stroke-width="2" stroke-opacity="0.4"/>
      <circle class="dot-on" cx="84" cy="344" r="9" fill="#141412" stroke="#141412" stroke-width="2.5"/>
    </g>
  </g>

  <g id="stage-04-adaptive-agents" class="stage" font-family="Inter, Arial, sans-serif">
    <g class="stage-dim">
      <line class="connector" x1="93" y1="472" x2="128" y2="472" stroke="#e2e2dc" stroke-width="2"/>
      <rect class="card-dim" x="128" y="424" width="584" height="96" rx="22" fill="#ffffff" stroke="#e4e4de"/>
      <rect class="chip-dim" x="156" y="452" width="40" height="40" rx="13" fill="#f1f1ec"/>
      <text class="chip-num-dim" x="176" y="477" text-anchor="middle" fill="#96968f" font-size="15" font-weight="700">04</text>
      <text class="label-dim" x="214" y="469" fill="#96968f" font-size="24" font-weight="700">Adaptive agents</text>
      <text class="caption-dim" x="214" y="495" fill="#b0b0a8" font-size="16">Evaluated, reliable behavior</text>
      <circle class="dot-dim" cx="84" cy="472" r="9" fill="#f7f7f4" stroke="#cfcfc8" stroke-width="2.5"/>
    </g>
    <g class="stage-on stage-on-4">
      <rect class="card-on" x="128" y="424" width="584" height="96" rx="22" fill="#ffffff" stroke="#c6c6bf"/>
      <rect class="chip-on" x="156" y="452" width="40" height="40" rx="13" fill="#141412"/>
      <text class="chip-num-on" x="176" y="477" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">04</text>
      <text class="label-on" x="214" y="469" fill="#141412" font-size="24" font-weight="700">Adaptive agents</text>
      <text class="caption-on" x="214" y="495" fill="#55554f" font-size="16">Evaluated, reliable behavior</text>
      <circle class="dot-ring" cx="84" cy="472" r="15" fill="none" stroke="#8b7ff0" stroke-width="2" stroke-opacity="0.4"/>
      <circle class="dot-on" cx="84" cy="472" r="9" fill="#141412" stroke="#141412" stroke-width="2.5"/>
    </g>
  </g>
</svg>
